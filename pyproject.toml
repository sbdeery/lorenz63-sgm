[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorenzscore"
version = "0.1.0"
description = "Score-based generative modeling for the Lorenz-63 system"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Sebastian Deery", email = "sbdeery@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "torchdiffeq>=0.2.5",
  "tensorboardX>=2.6",
]

[project.optional-dependencies]
dev = [
  "black",
  "isort",
  "flake8",
  "mypy",
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "sampling*", "scripts*", "training*", "utils*"]
exclude = ["demo_outputs*", "outputs*", "examples*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
